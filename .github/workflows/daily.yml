name: Daily Meesho Creator Automation

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. 00:30 UTC = 06:00 IST.
    - cron: '30 0 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TIMEZONE: Asia/Kolkata
      DAILY_RUN_TIME: '06:00'
      DATABASE_URL: sqlite:///data/meesho_automation.db
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
      GEMINI_VIDEO_MODEL: ${{ vars.GEMINI_VIDEO_MODEL }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      MEESHO_PROVIDER_ENABLED: ${{ vars.MEESHO_PROVIDER_ENABLED }}
      MEESHO_PRODUCT_FEED_URL: ${{ secrets.MEESHO_PRODUCT_FEED_URL }}
      TARGET_LANGUAGE: Hindi
      REEL_ASPECT_RATIO: '9:16'
      MAX_VIDEO_SECONDS: '10'
      MIN_PRICE_INR: '199'
      MAX_PRICE_INR: '999'
      MIN_COMMISSION_PERCENT: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pipeline once
        run: python app.py --run-once
